packages:
  - "anyharness/sdk"
  - "anyharness/sdk-react"
  - "anyharness/tests"
  - "cloud/sdk"
  - "cloud/sdk-react"
  - "apps/desktop"
  - "apps/mobile"
  - "apps/packages/design"
  - "apps/packages/product-client"
  - "apps/packages/product-domain"
  - "apps/packages/product-surfaces"
  - "apps/packages/product-ui"
  - "apps/packages/ui"
  - "server/artifact-runtime"
  - "apps/web"
  - "tests/intent"
  - "tests/release"

overrides:
  # Pin the Expo DOM WebView to the SDK 56 line. The SDK 54->56 upgrade left this
  # optional peer of @expo/log-box at the SDK 55 version (55.0.6), which no longer
  # satisfies @expo/log-box's ^56.0.6 peer range and forked a duplicate expo@56
  # install (flagged by expo-doctor's duplicate-native-module check).
  "@expo/dom-webview": "56.0.6"
  # react-native 0.85.3 bundles react-native-renderer 19.2.3 (baked in at RN build
  # time, not a separately installed package), and React requires `react` to match
  # the renderer exactly. Force a single react/react-dom 19.2.3 across the whole
  # workspace so no transitive dep can reintroduce a 19.2.x mismatch that crashes
  # the app with "Incompatible React versions".
  "react": "19.2.3"
  "react-dom": "19.2.3"

allowBuilds:
  "@sentry/cli": true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - esbuild
  - protobufjs
  - sharp
